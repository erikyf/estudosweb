<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb paralelo</title>
</head>
<body>
    <h1>Airbnb paralelo</h1>
    <label for="nome">Nome: </label>
    <input type="text" id="nome" name="nome">
    <label for="destino">Destino: </label>
    <select id="destino" name="destino">
        <option value="joaopessoa">João Pessoa</option>
        <option value="recife">Recife</option>
        <option value="natal">Natal</option>
        <option value="fortaleza">Fortaleza</option>
        <option value="Salvador">Salvador</option>
    </select>
    <label for="noites">Número de noites: </label>
    <input type="number" id="noites" name="noites">
    <br>
    <br>
    <button id="reservar">Fazer reserva</button>
    <h3>Status</h3>
    <p>Nome da reserva: </p>
    <p id="status"></p>
    <!-- <script src="script3.js"></script> -->
    <!-- <script src="script2.js"></script> -->
    <script src="script1.js"></script>
</body>
</html>
